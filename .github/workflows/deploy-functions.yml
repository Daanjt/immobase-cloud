name: Deploy Edge Functions

# Laeuft nur, wenn sich eine Edge Function oder deren Konfiguration aendert,
# damit normale Admin-Portal-Pushes (index.html) nichts neu deployen.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
      - '.github/check/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: aohcqrxpsqronlcwssrk
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Vor dem Deploy pruefen: Syntax, unbekannte Namen, doppelte Deklarationen, Importe.
      # Bei Fehlern bricht der Workflow ab, die laufenden Functions bleiben unveraendert.
      - name: Edge Functions pruefen
        run: bash .github/check/edge-check.sh
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy alle Functions im supabase/functions Ordner
        run: supabase functions deploy --project-ref "$PROJECT_ID"
