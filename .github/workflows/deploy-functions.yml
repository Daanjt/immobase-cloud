name: Deploy Edge Functions

# Laeuft nur, wenn sich eine Edge Function oder deren Konfiguration aendert,
# damit normale Admin-Portal-Pushes (index.html) nichts neu deployen.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: aohcqrxpsqronlcwssrk
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy alle Functions im supabase/functions Ordner
        run: supabase functions deploy --project-ref "$PROJECT_ID"
