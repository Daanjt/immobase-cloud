name: Auth - Schutz vor geleakten Passwoertern
on:
  workflow_dispatch:
jobs:
  setzen:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: aohcqrxpsqronlcwssrk
    steps:
      - name: password_hibp_enabled = true
        run: |
          code=$(curl -s -o resp.json -w "%{http_code}" -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"password_hibp_enabled": true}')
          echo "HTTP $code"
          python3 -c "import json;d=json.load(open('resp.json'));print('password_hibp_enabled =', d.get('password_hibp_enabled'), '|', str(d.get('message',''))[:200])"
          test "$code" = "200"
