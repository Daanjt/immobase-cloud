name: Wartung einmalig (Sicherheit + Aufraeumen)
on:
  workflow_dispatch:
jobs:
  wartung:
    runs-on: ubuntu-latest
    env:
      TOK: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: aohcqrxpsqronlcwssrk
    steps:
      - name: Ausfuehren
        shell: python
        run: |
          import os, json, urllib.request
          tok, ref = os.environ["TOK"], os.environ["REF"]
          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.supabase.com/v1/projects/%s%s" % (ref, path), data=data, method=method,
                    headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json", "User-Agent": "immobase-wartung"})
              try:
                  with urllib.request.urlopen(req) as r: return r.status, r.read().decode()[:300]
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:300]
          def sql(q): return call("POST", "/database/query", {"query": q})
          # 1) Test-Konto ohne Rolle loeschen
          print("Test-Konto:", sql("delete from auth.users where lower(email)='theijse.daan@gmail.com' and lower(email) not in (select lower(email) from public.allowed_users) returning email"))
          # 2) Leere Tabelle auszug_protokolle entfernen (nur wenn leer)
          print("Tabelle:", sql("do $$ begin if to_regclass('public.auszug_protokolle') is not null and not exists (select 1 from public.auszug_protokolle) then drop table public.auszug_protokolle; end if; end $$; select to_regclass('public.auszug_protokolle') as noch_da"))
          # 3) Nicht mehr benoetigte Functions loeschen
          for f in ["mail-preview-temp", "finalize-auszug"]:
              print("Function", f, call("DELETE", "/functions/" + f))
          # 4) Neue Konten muessen ihre E-Mail bestaetigen
          print("Auth:", call("PATCH", "/config/auth", {"mailer_autoconfirm": False}))
          s, b = call("GET", "/config/auth")
          print("mailer_autoconfirm jetzt:", json.loads(b).get("mailer_autoconfirm") if s == 200 else (s, b))
